#  ALLE DEUTSCHEN TEXTE DER WEBSITE
#
#  So bearbeitest du diese Datei:
#   • Ändere nur den Text RECHTS vom Doppelpunkt. Die Namen links (z. B. "titel:") bleiben gleich.
#   • Enthält ein Text einen Doppelpunkt mit Leerzeichen danach, setze ihn in "Anführungszeichen".
#   • Längere Texte stehen nach  >-  eingerückt auf den nächsten Zeilen.
#   • Einträge in Listen beginnen mit  -  (Bindestrich). Einfach kopieren, um einen neuen hinzuzufügen.
#   • Die englische Version liegt in  en.yaml  und hat genau denselben Aufbau.
#   • Schweizer Rechtschreibung: "ss" statt "ß".
