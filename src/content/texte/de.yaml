  von: von
  phase_bereit: Bereit
  phase_vorbereitung: Gleich geht's los
  phase_runde: Runde
  phase_pause: Pause
  phase_fertig: Training fertig
  fertig_text: Gut gemacht!
  letzte_sekunden: Noch 10 Sekunden
  weniger: weniger
  mehr: mehr
  tipp_titel: Tipps
  tipps:
    - Stell den Ton deines Handys laut – der Gong ist auch im Gym gut hörbar.
    - Der Bildschirm bleibt an, solange der Timer läuft.
    - Deine Einstellungen werden gespeichert.
    - Über „Zum Home-Bildschirm“ im Browser installierst du den Timer wie eine App.
  kein_js: Der Box-Timer braucht JavaScript. Bitte aktiviere es in deinem Browser.
  projekt_link: Wie der Timer entstanden ist

