  reaktion:
    eyebrow: Probier's aus
    titel: Wie schnell sind deine Reflexe?
    text: >-
      Mein erstes Web-Projekt war eine Sammlung von Mini-Spielen – das Reaktionsspiel
      gibt es hier in neuer Version. Warte, bis das Feld leuchtet, dann klick so schnell du kannst.
    start: Starten
    anleitung: Klick, tippe oder drücke die Leertaste, um zu starten.
    warten: Warte …
    warten_hinweis: Noch nicht klicken!
    los: JETZT!
    zu_frueh: Zu früh!
    zu_frueh_text: Warte, bis das Feld grün wird. Nochmal.
    ergebnis: Deine Zeit
