        wert: Zug, Schweiz
      - label: Schule
        wert: WISS Zürich
      - label: Ab 2027
        wert: Lehre bei Roche
      - label: Programmiere mit
        wert: JavaScript · Python
      - label: Sprachen
        wert: Deutsch · Türkisch · Englisch
      - label: Hobbys
        wert: Boxen · Gym · Go-Kart · Ski

  fakten:
    - wert: C1
      label: Cambridge English Advanced
    - wert: "3"
      label: Sprachen fliessend
    - wert: "2027"
      label: Lehrstart bei Roche
    - wert: "13"
      label: Jahre alt beim ersten Boxtraining

  motto:
    eyebrow: Mein Leitsatz
    zitat: >-
      Man kann körperlich so stark sein, wie man will – wenn man beim Morgengebet
      die Decke nicht hochheben kann, ist man schwach.

  weg:
    eyebrow: Mein Weg
    titel: Kein gerader Weg. Aber meiner.
    intro: >-
      Von der ersten Faszination für Computer bis zur Zusage von Roche – mit
      Umwegen, Rückschlägen und einem Jahr allein in England.
    eintraege:
      - zeit: Kindheit
        typ: start
        titel: Die Faszination beginnt
        text: >-
          Schon als Kind verbringe ich viel Zeit am Computer und liebe Videospiele.
          Früh ist mir klar: Technologie ist die Zukunft – und ich will ein Teil davon sein.
      - zeit: Mit 13
        typ: sport
        titel: Der erste Boxhandschuh
        text: >-
          Ich fange mit dem Boxen an und trainiere bis heute aktiv. Das Training bringt mir
          Disziplin und Geduld – auch ausserhalb der Halle.
      - zeit: Oberstufe
        typ: rueckschlag
        titel: Alles gegeben – und trotzdem keine Lehrstelle
        text: >-
          Ich arbeite hart an meinen Bewerbungen, doch am Ende reicht es nicht.
          Statt zu warten, treffe ich eine Entscheidung.
      - zeit: 2025 – 2026
        typ: bildung
        titel: Ein Jahr allein in England
        text: >-
          Ganz auf mich gestellt: Englisch perfektionieren, selbstständig werden und
          lernen, auf eigenen Füssen zu stehen. Am Ende halte ich zwei Zertifikate in der Hand.
        tags: [Cambridge C1 Advanced, ECDL]
      - zeit: 2026
        typ: rueckschlag
        titel: So knapp dran
        text: >-
          Für eine Lehre als Applikationsentwickler im Bereich Cybersecurity komme ich
          unter die letzten zwei – und erhalte doch eine Absage. Das war eine grosse
          Enttäuschung. Ich habe trotzdem weitergemacht.
      - zeit: 2026
        typ: meilenstein
        titel: Die Zusage von Roche
        text: >-
          Nach viel Arbeit und Schweiss ist sie da: die Zusage für eine Lehre als Informatiker
          Applikationsentwicklung bei Roche – einem der weltweit führenden Gesundheitsunternehmen
          und bekannt für seine starke Informatik-Ausbildung. Am Ende doch Applikationsentwickler.
      - zeit: 2026 – 2027
        typ: jetzt
        titel: WISS Zürich
        text: >-
          Damit kein Jahr verloren geht, besuche ich die Informatik-Wirtschaftsschule WISS
          in Zürich – als gezielte Vorbereitung, damit ich zum Lehrstart bereit bin.
      - zeit: 2027
        typ: zukunft
        titel: Lehrstart bei Roche in Rotkreuz
        text: Start meiner Lehre als Informatiker Applikationsentwicklung.
      - zeit: In 5 Jahren
        typ: ziel
        titel: Das Ziel
        text: >-
          Lehre abgeschlossen, Studium an einer guten internationalen Universität –
          und im Boxen etwas erreicht. Mein grosses Ziel: Schweizer Meister bei den Amateuren.
          Und mein Traum für später: eine eigene Firma, die Software entwickelt.
    jetzt_label: Jetzt

  werte:
    eyebrow: Werte
    titel: Worauf du dich verlassen kannst.
    intro: Was mir in der Arbeit – und im Team – am wichtigsten ist.
    liste:
      - icon: shield-check
        titel: Zuverlässigkeit
        text: Wenn ich etwas zusage, halte ich es. Gründlich, pünktlich und ohne Ausreden.
      - icon: handshake
        titel: Loyalität
        text: Ich stehe zu meinem Team und zu den Menschen, mit denen ich arbeite – auch wenn es schwierig wird.
      - icon: heart-handshake
        titel: Support
        text: Ich helfe gern und bin gern im Team. Gemeinsam kommt man weiter als allein.
      - icon: flame
        titel: Durchhaltevermögen
        text: Rückschläge gehören dazu. Ich lerne daraus und mache weiter.

  freizeit:
    eyebrow: Ausserhalb vom Code
    titel: Was ich neben dem Programmieren mache.
    intro: Sport ist für mich der perfekte Ausgleich.
    liste:
      - icon: hand-fist
        titel: Boxen
        text: Seit ich 13 bin, trainiere ich aktiv. Mein Ziel ist der Schweizer Meistertitel bei den Amateuren.
        highlight: Ziel – Schweizer Meister
      - icon: dumbbell
        titel: Gym
        text: Krafttraining gehört fest zu meiner Woche. Routine, die sich auf alles überträgt.
      - icon: flag
        titel: Go-Kart
        text: Seit Jahren auf der Strecke – und ziemlich schnell unterwegs.
      - icon: mountain-snow
        titel: Ski
        text: Auf den Ski, seit ich drei oder vier bin. Fast jeden Winter geht es in die Berge.

  sprachen:
    eyebrow: Sprachen
    titel: Ich spreche deine Sprache.
    liste:
      - sprache: Türkisch
        niveau: Muttersprache
        stufe: 5
