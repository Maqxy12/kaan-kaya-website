boxtimer:
  seo_titel: Box-Timer
  seo_beschreibung: Kostenloser Rundentimer fürs Boxtraining – mit Gong, 10-Sekunden-Warnung und Bildschirm, der anbleibt. Von Kaan Kaya.
  eyebrow: Werkzeug · Box-Timer
  titel: Rundentimer fürs Boxtraining.
  intro: >-
    Den nutze ich selbst im Training: Runden und Pausen einstellen, Start drücken, Handy
    hinlegen. Ein Gong startet und beendet jede Runde, 10 Sekunden vor Schluss kommt ein Warnsignal.
  einstellungen: Einstellungen
  runden: Runden
  rundenzeit: Rundenzeit
  pause: Pause
  vorbereitung: Vorbereitung
  gesamt: Gesamtdauer
