# ─────────────────────────────── STARTSEITE ───────────────────────────────
start:
  seo_titel: Kaan Kaya – Angehender Software Engineer aus Zug
  badge: Ab 2027 Lehre als Applikationsentwickler bei Roche
  titel: Angehender
  titel_akzent: Software Engineer.
  intro: >-
    Ich bin Kaan, lerne Informatik an der WISS in Zürich und starte 2027 meine
    Lehre als Informatiker Applikationsentwicklung bei Roche in Rotkreuz. Ich baue Dinge fürs Web, lerne jeden
    Tag dazu.
  cta_projekte: Projekte ansehen
  cta_kontakt: Kontakt aufnehmen

  karte:
    titel: Steckbrief
    untertitel: Kurz & knapp
    foto_alt: Porträt von Kaan Kaya
    felder:
