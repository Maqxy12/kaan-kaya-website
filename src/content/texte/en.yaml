# ─────────────────────────────── HOME ───────────────────────────────
start:
  seo_titel: Kaan Kaya – Aspiring Software Engineer from Zug, Switzerland
  badge: Application developer apprenticeship at Roche from 2027
  titel: Software engineer
  titel_akzent: in the making.
  intro: >-
    I'm Kaan. I study IT at WISS in Zurich and start my apprenticeship as an
    application developer at Roche in Rotkreuz in 2027. I build things for the web and
    learn something new every day.
  cta_projekte: View projects
  cta_kontakt: Get in touch

  karte:
    titel: Fact sheet
    untertitel: At a glance
    foto_alt: Portrait of Kaan Kaya
    felder:
      - label: Based in
        wert: Zug, Switzerland
      - label: School
        wert: WISS Zurich
      - label: From 2027
        wert: Apprenticeship at Roche
      - label: Coding in
        wert: JavaScript · Python
      - label: Languages
        wert: German · Turkish · English
      - label: Hobbies
        wert: Boxing · Gym · Karting · Skiing

  fakten:
    - wert: C1
      label: Cambridge English Advanced
    - wert: "3"
      label: Languages spoken fluently
    - wert: "2027"
      label: Apprenticeship starts at Roche
    - wert: "13"
      label: Years old at my first boxing session

  motto:
    eyebrow: My guiding principle
    zitat: >-
      You can be as physically strong as you want – if you can't lift your blanket
      for the morning prayer, you are weak.

  weg:
    eyebrow: My journey
    titel: Not a straight path. But mine.
    intro: >-
      From my first fascination with computers to an offer from Roche – with detours,
      setbacks and a year on my own in England.
    eintraege:
      - zeit: Childhood
        typ: start
        titel: The fascination begins
        text: >-
          As a kid I spend a lot of time on the computer and love video games.
          Early on I know: technology is the future – and I want to be part of it.
      - zeit: Age 13
        typ: sport
        titel: My first boxing gloves
        text: >-
          I start boxing and still train actively today. Training gives me discipline and
          patience – outside the gym too.
      - zeit: Secondary school
        typ: rueckschlag
        titel: Gave it everything – still no apprenticeship
        text: >-
          I work hard on my applications, but in the end it isn't enough.
          Instead of waiting, I make a decision.
      - zeit: 2025 – 2026
        typ: bildung
        titel: A year on my own in England
        text: >-
          Completely on my own: perfecting my English, becoming independent and learning
          to stand on my own two feet. I come home with two certificates.
        tags: [Cambridge C1 Advanced, ECDL]
      - zeit: 2026
        typ: rueckschlag
        titel: So close
        text: >-
          For an apprenticeship as an application developer in cybersecurity, I make it
          to the final two – and still get a rejection. That was a big disappointment.
          I kept going anyway.
      - zeit: 2026
        typ: meilenstein
        titel: The offer from Roche
        text: >-
          After a lot of hard work, it finally arrives: an offer for an apprenticeship in
          application development at Roche – one of the world's leading healthcare companies
          and known for its outstanding IT training. An application developer after all.
      - zeit: 2026 – 2027
        typ: jetzt
        titel: WISS Zurich
        text: >-
          So that no year goes to waste, I attend the IT business school WISS in Zurich –
          focused preparation so I'm ready on day one of my apprenticeship.
      - zeit: 2027
        typ: zukunft
        titel: Apprenticeship starts at Roche in Rotkreuz
        text: The start of my apprenticeship in application development.
      - zeit: In 5 years
        typ: ziel
        titel: The goal
        text: >-
          Apprenticeship completed, studying at a great international university – and
          achievements in boxing. My big goal: Swiss amateur champion.
          And my dream for later: my own company that builds software.
    jetzt_label: Now

  werte:
    eyebrow: Values
    titel: What you can count on.
    intro: What matters most to me at work – and in a team.
    liste:
      - icon: shield-check
        titel: Reliability
        text: When I commit to something, I deliver. Thorough, on time, no excuses.
      - icon: handshake
        titel: Loyalty
        text: I stand by my team and the people I work with – especially when it gets tough.
      - icon: heart-handshake
        titel: Support
        text: I like helping and I love working in a team. Together you get further than alone.
      - icon: flame
        titel: Perseverance
        text: Setbacks are part of it. I learn from them and keep going.

  freizeit:
    eyebrow: Beyond code
    titel: What I do besides programming.
    intro: Sport is the perfect balance for me.
    liste:
      - icon: hand-fist
        titel: Boxing
        text: I've been training actively since I was 13. My goal is the Swiss amateur title.
        highlight: Goal – Swiss champion
      - icon: dumbbell
        titel: Gym
        text: Strength training is a fixed part of my week. A routine that carries over into everything.
      - icon: flag
        titel: Go-karting
        text: On the track for years – and pretty fast.
      - icon: mountain-snow
        titel: Skiing
        text: On skis since I was three or four. Almost every winter I'm up in the mountains.

  sprachen:
    eyebrow: Languages
    titel: I speak your language.
    liste:
