        niveau: C1 · Cambridge Advanced
        stufe: 4
      - sprache: French
        niveau: Basic
        stufe: 1
      - sprache: Japanese
        niveau: Basic
        stufe: 1

  reaktion:
    eyebrow: Try it
    titel: How fast are your reflexes?
    text: >-
      My first web project was a collection of mini games – here's the reaction game
      in a new version. Wait until the field lights up, then click as fast as you can.
    start: Start
    anleitung: Click, tap or press space to start.
    warten: Wait …
    warten_hinweis: Don't click yet!
    los: NOW!
    zu_frueh: Too early!
    zu_frueh_text: Wait until the field turns green. Again.
    ergebnis: Your time
